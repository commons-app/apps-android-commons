# Re-enabled without GitHub Models: assignment intent uses the same deterministic
# phrase patterns as guide_new_contributors.yml (see #6977).
name: Auto Assign

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]

permissions:
  issues: write
  # Needed to count the commenter's merged PRs and open PRs
  pull-requests: read

concurrency:
  group: auto-assign-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  auto-assign:
    runs-on: ubuntu-latest
    # Skip PR review comments; bots never get assigned from their own comments
    if: >
      github.event_name == 'issues' ||
      (!github.event.issue.pull_request && github.event.comment.user.type != 'Bot')
    steps:
      - name: Handle assignment
        uses: actions/github-script@v8
        with:
          script: |
            const welcomeMessage = `\n\nSince you're new here, a huge welcome to the team! ❤️ Feel free to check out our welcome guide to get started: https://github.com/commons-app/commons-app-documentation/blob/master/android/Volunteers-welcome!.md`;

            // Keep in sync with guide_new_contributors.yml
            const requestPatterns = [
              // "please assign me", "assign this issue to me"
              /(?<!-)\bassign (this |it |the issue |this issue |#\d+ )?(to )?me\b/i,
              // "can I be assigned?", "could this be assigned to me?", "can I get this issue assigned?"
              /\b(can|could|may) (i|this|it) (please )?(be|get|get this|get it|get this issue) assigned\b/i,
              // "I'd like to be assigned", "happy to be assigned"
              /\b(like|love|want|happy|glad) to be assigned\b/i,
              // "I'd like to work on this", "can I fix this?", "I'm interested in working on this"
              /\b(i'?d like|i would like|i'?d love|i would love|i want|i'?m interested in|i am interested in|can i|could i|may i|is it okay for me|is it ok for me)( please)? (to )?(try (and |to )?)?(work on|working on|take up|taking up|take on|pick up|fix|fixing|solve|take|try) (this|it|the issue)\b/i,
              // "can I take this up?", "I can pick it up"
              /\b(i'?d like|i would like|i want|can i|could i|may i|i can|i'?ll|let me) (to )?(take|pick) (this|it) up\b/i,
              // "I'd like to give this a try", "I'll take a shot at this"
              /\b(i'?d like|i would like|i'?d love|can i|could i|may i|i'?ll|let me) (to )?(give (this|it) a (try|shot|go)|take a (shot|stab) at (this|it))\b/i,
              // Explicit slash command used by many open-source assign bots
              /(^|\n)\s*\/assign\b/i,
            ];

            function isAssignmentRequest(rawBody) {
              const text = (rawBody || '')
                .replace(/```[\s\S]*?```/g, '')
                .split('\n').filter(line => !line.trim().startsWith('>')).join('\n')
                .replace(/’/g, "'");
              return requestPatterns.some(pattern => pattern.test(text));
            }

            // Bug report form renders as "### Would you like to work on the issue?\n\nYes"
            function reporterOptedIn(rawBody) {
              return /### Would you like to work on the issue\?\s*\r?\n\s*Yes\b/i.test(rawBody || '');
            }

            let candidate;
            let authorAssociation;
            let isFirstTime;

            // Inside github-script, use context.eventName (github is the Octokit client).
            if (context.eventName === 'issues') {
              if (!reporterOptedIn(context.payload.issue.body)) {
                core.info('Reporter did not opt in to work on the issue');
                return;
              }
              candidate = context.payload.issue.user.login;
              authorAssociation = context.payload.issue.author_association;
            } else {
              if (!isAssignmentRequest(context.payload.comment.body)) {
                core.info('Comment is not an assignment request');
                return;
              }
              candidate = context.payload.comment.user.login;
              authorAssociation = context.payload.comment.author_association;
            }

            isFirstTime = authorAssociation === 'FIRST_TIME_CONTRIBUTOR' || authorAssociation === 'NONE';

            const issue = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            if (issue.data.state !== 'open') {
              core.info('Issue is not open');
              return;
            }

            // New contributors should start with bugs or good first issues.
            // On issue_comment, guide_new_contributors.yml posts the explanation.
            // On issues:opened it does not run, so we post the same guidance here.
            const isNewcomerFriendly = issue.data.type?.name === 'Bug'
              || issue.data.labels.some(label => (label.name || label) === 'good first issue');

            if (!isNewcomerFriendly) {
              const mergedPullRequests = await github.rest.search.issuesAndPullRequests({
                q: `repo:${context.repo.owner}/${context.repo.repo} is:pr is:merged author:${candidate}`,
                per_page: 1
              });

              if (mergedPullRequests.data.total_count < 6) {
                core.info(`Skipping assign for ${candidate}: fewer than 6 merged PRs on a non-newcomer issue`);
                if (context.eventName === 'issues') {
                  const marker = `<!-- guide-new-contributors: ${candidate} -->`;
                  let body = `Hi @${candidate}! Thank you for your enthusiasm!`;
                  body += `\n\nWhile we appreciate your interest in fixing this issue, we found out that contributors who are not veterans learn better from fixing bugs (issues with Type=Bug) or working on good first issues (issues with Label=good first issue). [Our documentation](https://github.com/commons-app/commons-app-documentation/blob/master/android/Volunteers-welcome!.md#developers) contains the details and a link to an issue search that gives you the best issues to work on.`;
                  body += `\n\nWould you mind trying that? Once you have found a suitable issue you want to solve, you can ask to be assigned there.`;
                  body += `\n\nThanks a lot!`;
                  body += `\n${marker}`;

                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: context.issue.number,
                    body: body
                  });
                }
                return;
              }
            }

            if (issue.data.assignees.length > 0) {
              if (issue.data.assignees.some(assignee => assignee.login === candidate)) {
                core.info(`${candidate} is already assigned`);
                return;
              }

              let body = `Hi @${candidate}! Thanks for reaching out. It looks like someone is already working on this one at the moment. `;
              body += `\n\nNo worries, though-there are plenty of other ways to help! You can find more open issues here: https://github.com/commons-app/apps-android-commons/issues?q=is%3Aissue%20state%3Aopen%20type%3ABug%20no%3Aassignee%20-label%3A%22low%20priority%22%20-label%3Adebated%20-label%3Aupstream`;
              if (isFirstTime) body += welcomeMessage;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
              return;
            }

            const assignedIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              assignee: candidate,
              state: 'open'
            });

            // pulls.list has no creator filter; GitHub ignores it and returns every open PR.
            const openPullRequests = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:pr is:open author:${candidate}`,
              per_page: 1
            });
            const hasOpenPullRequest = openPullRequests.data.total_count > 0;

            // - No assigned issues: safe to assign
            // - Has assigned issues and an open PR: safe (waiting for review)
            // - Has assigned issues but no open PR: ask them to finish first
            if (assignedIssues.data.length === 0 || hasOpenPullRequest) {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                assignees: [candidate]
              });

              let body = `Hi @${candidate}! You have been assigned to this issue. ✨`;
              if (isFirstTime) body += welcomeMessage;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `Hi @${candidate}! It looks like you're already busy with another open task. To keep things moving and make sure everyone gets a chance to help out, we usually recommend wrapping up your current work before starting something new. \n\nOnce you've submitted a PR for your current task, we'd be happy to help you get started on this one! ✨`
              });
            }
